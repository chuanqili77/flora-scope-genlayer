name: Contract Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run contract unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Install GenVM linter
        run: python -m pip install --disable-pip-version-check genvm-linter==0.11.0

      - name: Validate contract
        run: genvm-lint check contracts/contract.py --json

      - name: Verify deployed Studionet evidence
        run: npm run verify:live
